<g style="display:none">
<rect x="40" y="345" width="610" height="95" rx="8" stroke-width="0.5" style="fill:rgb(245, 245, 245);stroke:rgb(180, 178, 169);color:rgb(255, 255, 255);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<text x="52" y="365" fill="#2C2C2A" style="fill:rgb(30, 30, 30);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:auto">The sum constraint Σⱼ y = 1 picks one row to "light up". On every other row, the equality</text>
<text x="52" y="383" fill="#2C2C2A" style="fill:rgb(30, 30, 30);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:auto">λᴸ + λᴿ = y_aj forces λᴸ and λᴿ to zero (because both are non-negative and y is zero). The</text>
<text x="52" y="401" fill="#2C2C2A" style="fill:rgb(30, 30, 30);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:auto">global sums Σ_j (λᴸ·E_j + λᴿ·E_{j+1}) and Σ_j (λᴸ·TC_j + λᴿ·TC_{j+1}) therefore collapse to</text>
<text x="52" y="419" fill="#2C2C2A" style="fill:rgb(30, 30, 30);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:auto">contributions from the active segment only — yielding a clean point on its chord.</text>
</g>
